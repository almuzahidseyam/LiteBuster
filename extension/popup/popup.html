<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Load WebGPU optimized ONNX Runtime -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
  <style>
    body { width: 100%; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; background: #0f172a; color: #f8fafc; box-sizing: border-box;}
    h2 { margin-top: 0; font-size: 20px; text-align: center; color: #38bdf8; }
    .status-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; font-weight: bold; font-family: monospace; font-size: 14px;}
    .metrics { font-size: 12px; color: #94a3b8; margin-top: 10px; display: flex; justify-content: space-between; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
    .badge { background: #059669; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; vertical-align: middle; margin-left: 5px; }
  </style>
</head>
<body>
  <h2>LiteBuster <span class="badge">WebGPU</span></h2>
  <div class="status-box">
      <div id="status">Ready for processing...</div>
      <div class="metrics">
          <span id="backend-metric">Backend: CPU</span>
          <span id="time-metric">Time: 0ms</span>
      </div>
  </div>
  <button id="solve-btn">Initialize Hardware & Solve</button>
  <script src="popup.js"></script>
</body>
</html>
