<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body { width: 320px; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; background: #f9fafb; color: #1f2937; }
    h2 { margin-top: 0; font-size: 18px; text-align: center; }
    .status-box { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: center; min-height: 20px; font-weight: bold; }
    button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #4f46e5; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>LiteBuster Extension</h2>
  <div class="status-box" id="status">Waiting for user...</div>
  <button id="solve-btn">Solve Audio CAPTCHA</button>
  <script src="popup.js"></script>
</body>
</html>
